<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web-Wide-Water test page</title>
  <style>
    body { margin: 0; font: 17px/1.6 Georgia, serif; color: #1c2430; background: #fbfaf7; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 120px; }
    h1 { font: 700 34px/1.2 system-ui, sans-serif; }
    h2 { font: 700 22px/1.3 system-ui, sans-serif; margin-top: 2em; }
    .bar { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #ddd; padding: 8px 20px; font: 14px system-ui, sans-serif; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; z-index: 5; }
    button { font: inherit; padding: 4px 10px; }
    #clicks { font-weight: 700; }
    #stats { margin-left: auto; font-variant-numeric: tabular-nums; color: #567; }
  </style>
</head>
<body>
  <!-- Offline test page. It loads the content scripts in manifest order, without the
       extension. Add ?timer to drive animation from a timer (for background windows),
       ?off to start with the sea off. -->
  <div class="bar">
    <button id="toggle">Sea on/off</button>
    <button id="summon">Summon orca</button>
    <label>Busy <input id="busy" type="range" min="0" max="100" value="65"></label>
    <label>Distortion <input id="dist" type="range" min="0" max="100" value="35"></label>
    <button id="count">Click me</button> <span id="clicks">0</span>
    <a href="#bottom">A link</a>
    <span id="stats"></span>
  </div>
  <main id="text"></main>

  <script>
    const q = new URLSearchParams(location.search);
    if (q.has('timer')) window.__seaClock = 'timer';
    window.__seaDemo = { on: !q.has('off') };

    const para = 'The sea covered the page from edge to edge, and under it the words went on meaning exactly what they had meant before. A pod of orcas crossed from the margin, their tall fins drawing thin white lines through the paragraphs. Nothing was moved, nothing was hidden, and every link still went where it said it would. ';
    const main = document.getElementById('text');
    const h1 = document.createElement('h1'); h1.textContent = 'A quiet page, under water'; main.append(h1);
    for (let i = 0; i < 14; i++) {
      if (i % 4 === 1) { const h = document.createElement('h2'); h.textContent = 'Section ' + (i + 3) / 4; main.append(h); }
      const p = document.createElement('p'); p.textContent = para.repeat(2 + (i % 3)); main.append(p);
    }
    const end = document.createElement('p'); end.id = 'bottom'; end.textContent = 'The bottom of the page.'; main.append(end);

    let clicks = 0;
    document.getElementById('count').onclick = () => { document.getElementById('clicks').textContent = ++clicks; };

    (async () => {
      const fresh = '?v=' + Date.now();   // never test a cached copy
      const manifest = await (await fetch('../manifest.json' + fresh)).json();
      for (const src of manifest.content_scripts[0].js) {
        await new Promise((ok, fail) => {
          const s = document.createElement('script');
          s.src = '../' + src + fresh; s.onload = ok; s.onerror = fail;
          document.head.append(s);
        });
      }
      document.getElementById('toggle').onclick = () => Sea.set({ on: !Sea.settings.on });
      document.getElementById('summon').onclick = () => Sea.world.summon('orca');
      document.getElementById('busy').oninput = (e) => Sea.set({ busy: +e.target.value });
      document.getElementById('dist').oninput = (e) => Sea.set({ distortion: +e.target.value });
      setInterval(() => {
        if (!Sea.active) { document.getElementById('stats').textContent = 'off'; return; }
        const s = Sea.stats();
        document.getElementById('stats').textContent = `water ${s.waterMs} ms · scene ${s.sceneMs} ms · ${s.faces} faces · ${s.fps} fps`;
      }, 500);
    })();
  </script>
</body>
</html>
